[project]
name = "tastetrace-api"
version = "0.1.0"
description = "FastAPI backend with cookie-session auth, Postgres, and Railway deploy"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastapi-users[sqlalchemy]>=15.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "resend>=2.4",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.20",
    "anthropic>=1.6.0",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
# The app is run, not installed — put the repo root on sys.path so
# `import app` works the same way it does under uvicorn and alembic.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
